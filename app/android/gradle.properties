# Trimmed down from the Flutter template's default (-Xmx8G, 4G metaspace,
# 512m code cache): this dev machine has no Windows page file, so the
# system's virtual-memory commit ceiling is capped at physical RAM. The
# template's defaults reserve ~12.5G *per JVM daemon* (gradle + Kotlin each
# spawn one), which exhausts that ceiling even with RAM to spare. These
# smaller values are still comfortably enough for this small app.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
